name: Keepalive Mensual (Evita pausa de crons a los 60 días)

on:
  workflow_dispatch:
  schedule:
    # Día 1 de cada mes a las 06:00 UTC (cada ~30 días, muy por debajo del límite de 60 días de GitHub)
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar marca de actividad y hacer commit
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || git commit -m "chore(keepalive): mantener activos los crons de GitHub Actions [skip ci]"
          git push
