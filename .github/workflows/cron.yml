name: Actualizador Semanal RFAF

on:
  schedule:
    # Se ejecuta todos los lunes a las 06:00 UTC (07:00 hora española)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Permite ejecutarlo manualmente en cualquier momento desde GitHub

jobs:
  scraping-semanal:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v3

    - name: Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar script de actualización
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python actualizador_semanal.py