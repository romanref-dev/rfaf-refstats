name: Extractor Automático RFAF

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 04:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic desde GitHub

jobs:
  run-extractor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 supabase
          playwright install chromium
          playwright install-deps chromium

      - name: Ejecutar Extractor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python extractor.py