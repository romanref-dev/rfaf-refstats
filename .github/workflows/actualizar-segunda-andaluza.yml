name: Actualizar 2ª Andaluza Sénior (8 Provincias)

on:
  workflow_dispatch:
  # Cron desactivado temporalmente para ahorrar minutos de Actions mientras solo se usan las 12 competiciones principales.
  # Descomentar cuando quieras activar la carga automática semanal de 2ª Andaluza:
  # schedule:
  #   - cron: "30 9 * * 1"

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar extracción y guardado (2ª Andaluza)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -u guarda_segunda_andaluza.py
