
name: Actualizar Division de Honor RFAF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "guarda_division_honor.py"
      - "config.py"
      - ".github/workflows/actualizar-rfaf.yml"
  schedule:
    - cron: "30 22 * * 0"
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar extracción y guardado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -u guarda_division_honor.py
